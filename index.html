<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KBPO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="scene">
  <div class="sky"></div>
  <div class="sun-glow"></div>
  <div class="hills back"></div>
  <div class="hills front"></div>
  <div class="ground"></div>
  <div class="ground-mist"></div>

  <!-- El meet es clave aquí junto con el CSS que ajustamos -->
  <svg id="garden-svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMax meet" aria-hidden="true">    <radialGradient id="petalGradA" cx="50%" cy="15%" r="90%">
        <stop offset="0%" stop-color="#fffbe6"/>
        <stop offset="45%" stop-color="#ffe27a"/>
        <stop offset="78%" stop-color="#ffc247"/>
        <stop offset="100%" stop-color="#f2932c"/>
      </radialGradient>
      <radialGradient id="petalGradB" cx="50%" cy="15%" r="90%">
        <stop offset="0%" stop-color="#fff6d0"/>
        <stop offset="45%" stop-color="#ffd35c"/>
        <stop offset="80%" stop-color="#ffab30"/>
        <stop offset="100%" stop-color="#e8791a"/>
      </radialGradient>
      <radialGradient id="petalGradInner" cx="50%" cy="20%" r="90%">
        <stop offset="0%" stop-color="#fffef2"/>
        <stop offset="60%" stop-color="#fff0ab"/>
        <stop offset="100%" stop-color="#ffdb6e"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#d98a1f"/>
        <stop offset="55%" stop-color="#8a4b12"/>
        <stop offset="100%" stop-color="#4a2a08"/>
      </radialGradient>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(255,222,140,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,222,140,0)"/>
      </radialGradient>
      <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#274016"/>
        <stop offset="55%" stop-color="#4b7a30"/>
        <stop offset="100%" stop-color="#6fae44"/>
      </linearGradient>
      <linearGradient id="leafGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#2c4a1c"/>
        <stop offset="100%" stop-color="#6fae44"/>
      </linearGradient>
      <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff3da"/>
        <stop offset="55%" stop-color="#eab55e"/>
        <stop offset="100%" stop-color="#b97f2e"/>
      </linearGradient>
      <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>
    <g id="garden-root"></g>
  </svg>

  <div id="fireflies"></div>
  <div id="petals-fall"></div>
  <div id="sparkles"></div>
  <div class="surprise-flash" id="flash"></div>

  <div class="ui">
    <section id="view-flowers" class="view">
      <p class="hint">— Para ti bonita —</p>
      <button id="btn-open" class="btn">Feliz dia colajon</button>
    </section>

    <section id="view-note" class="view hidden">
      <div class="carta">
        <svg class="carta-flower" viewBox="-40 -60 80 90" aria-hidden="true">
          <use href="#deco-flower"/>
        </svg>
        <p class="texto-manuscrito">
            Aunque no pueda dártelas en persona, quise encontrar una manera de hacerlas. Porque, aunque haya cosas que no puedo darte, siempre voy a buscar la forma de hacerte sentir cuánto te amo bonita.
        </p>
        <button id="btn-back" class="btn-mini">← volver</button>
      </div>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
